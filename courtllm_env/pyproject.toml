[project]
name = "courtllm-env"
version = "1.0.0"
description = "A multi-agent courtroom environment for LLM hallucination reduction"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.3",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "sentence-transformers>=2.2.0",
    "wikipedia-api>=0.6.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["courtllm_env", "courtllm_env.server"]
